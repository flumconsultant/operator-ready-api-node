<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><link rel="icon" href="../../assets/logo/favicon.svg" />
<style>@media (max-width:1180px){[data-nav]{display:none!important}}@media (min-width:1181px){[data-burger]{display:none!important}}</style></helmet>
<header data-header style="position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(8,11,30,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-hairline-dark);box-shadow:0 18px 44px -34px rgba(0,0,0,.9)">
<div data-bar style="max-width:var(--maxw-content);margin:0 auto;min-height:72px;padding-top:14px;padding-bottom:14px;padding-left:var(--gutter-page);padding-right:var(--gutter-page);display:flex;align-items:center;gap:var(--space-8);flex-wrap:nowrap">
<a href="./WebsiteEs.dc.html" style="display:flex;align-items:center;text-decoration:none"><img src="../../assets/logo/wordmark-white.png" alt="BECOME" style="height:23px;width:auto;display:block" /></a>
<nav data-nav style="display:flex;align-items:center;gap:var(--space-6);margin-left:auto;flex-wrap:nowrap">
<a href="./WebsiteEs.dc.html#propuesta" style="font:var(--type-body);color:var(--slate-200);text-decoration:none;padding:12px 0;white-space:nowrap;border-bottom:1px solid transparent" style-hover="color:var(--electric-green);border-color:var(--green-line)">Propuesta de valor</a>
<a href="./PaginaFramework.dc.html" style="font:var(--type-body);color:var(--slate-200);text-decoration:none;padding:12px 0;white-space:nowrap;border-bottom:1px solid transparent" style-hover="color:var(--electric-green);border-color:var(--green-line)">Cómo trabajamos</a>
<a href="./PaginaTrabajo.dc.html" style="font:var(--type-body);color:var(--slate-200);text-decoration:none;padding:12px 0;white-space:nowrap;border-bottom:1px solid transparent" style-hover="color:var(--electric-green);border-color:var(--green-line)">Casos</a>
<a href="./PaginaThinking.dc.html" style="font:var(--type-body);color:var(--slate-200);text-decoration:none;padding:12px 0;white-space:nowrap;border-bottom:1px solid transparent" style-hover="color:var(--electric-green);border-color:var(--green-line)">Insights</a>
<a href="./PaginaNosotros.dc.html" style="font:var(--type-body);color:var(--slate-200);text-decoration:none;padding:12px 0;white-space:nowrap;border-bottom:1px solid transparent" style-hover="color:var(--electric-green);border-color:var(--green-line)">Sobre nosotros</a>
</nav>
<div style="display:flex;align-items:center;gap:var(--space-5)">
<span style="font:var(--type-label);letter-spacing:var(--track-label);color:var(--slate-300);white-space:nowrap"><span style="color:var(--white)">ES</span> / <a href="../website-en/WebsiteEn.dc.html" style="color:var(--slate-300);text-decoration:none" style-hover="color:var(--electric-green)">EN</a></span>
<a href="./PaginaContacto.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 var(--space-6);border-radius:var(--radius-pill);background:var(--electric-green);color:var(--deep-navy);font:var(--type-label);letter-spacing:var(--track-label);text-transform:uppercase;text-decoration:none;white-space:nowrap" style-hover="background:var(--neon-green)">Inicia tu Discovery</a>
<button data-burger type="button" aria-label="Abrir menú" onClick="{{ toggle }}" style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--border-strong-dark);border-radius:2px;background:transparent;color:var(--white);cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
</div>
</div>
</header>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div style="position:fixed;inset:0;z-index:60;background:var(--navy-950);padding:var(--space-6) var(--gutter-page);display:flex;flex-direction:column;overflow:auto">
<div style="display:flex;align-items:center;justify-content:space-between">
<img src="../../assets/logo/wordmark-white.png" alt="BECOME" style="height:23px;width:auto;display:block" />
<button type="button" aria-label="Cerrar menú" onClick="{{ toggle }}" style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--border-strong-dark);border-radius:2px;background:transparent;color:var(--white);cursor:pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<nav style="margin-top:var(--space-10);display:flex;flex-direction:column;gap:var(--space-5)">
<a href="./WebsiteEs.dc.html#propuesta" style="font:var(--type-h2);letter-spacing:var(--track-heading);color:var(--white);text-decoration:none">Propuesta de valor</a>
<a href="./PaginaFramework.dc.html" style="font:var(--type-h2);letter-spacing:var(--track-heading);color:var(--white);text-decoration:none">Cómo trabajamos</a>
<a href="./PaginaTrabajo.dc.html" style="font:var(--type-h2);letter-spacing:var(--track-heading);color:var(--white);text-decoration:none">Casos</a>
<a href="./PaginaThinking.dc.html" style="font:var(--type-h2);letter-spacing:var(--track-heading);color:var(--white);text-decoration:none">Insights</a>
<a href="./PaginaNosotros.dc.html" style="font:var(--type-h2);letter-spacing:var(--track-heading);color:var(--white);text-decoration:none">Sobre nosotros</a>
</nav>
<div style="margin-top:var(--space-9);padding-top:var(--space-6);border-top:1px solid var(--border-hairline-dark);display:flex;flex-direction:column;gap:var(--space-4)">
<a href="./PaginaDiscovery.dc.html" style="font:var(--type-body);color:var(--slate-200);text-decoration:none">AI-Native Transformation Discovery</a>
<a href="./PaginaBuildEmbed.dc.html" style="font:var(--type-body);color:var(--slate-200);text-decoration:none">Build &amp; Embed Sprint</a>
</div>
<a href="./PaginaContacto.dc.html" style="display:inline-flex;align-items:center;justify-content:center;margin-top:var(--space-9);min-height:52px;padding:0 var(--space-7);border-radius:var(--radius-pill);background:var(--electric-green);color:var(--deep-navy);font:var(--type-label);letter-spacing:var(--track-label);text-transform:uppercase;text-decoration:none">Inicia tu Discovery</a>
<span style="margin-top:var(--space-8);font:var(--type-label);letter-spacing:var(--track-label);color:var(--slate-300)"><span style="color:var(--white)">ES</span> / <a href="../website-en/WebsiteEn.dc.html" style="color:var(--slate-300);text-decoration:none">EN</a></span>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    return { open: this.state.open, toggle: () => this.setState((s) => ({ open: !s.open })) };
  }
}
</script>
</body>
</html>
