<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

    <!-- Lo primero que se ejecuta, y a propósito.

         Dentro de #root viaja un resumen en texto plano de la página: títulos,
         párrafos y enlaces sin una sola clase. Existe para los rastreadores que
         NO ejecutan JavaScript —GPTBot, ClaudeBot, PerplexityBot— porque para
         ellos una página vacía es una página que no dice nada.

         El problema es que un navegador tampoco sabe que eso es un apaño: lo
         pinta tal cual, y durante el segundo que tarda la aplicación en
         arrancar el visitante ve un muro de texto sin maquetar. Parece un sitio
         roto. Lo estaba viendo cualquiera que entrara desde el móvil.

         Esta línea marca el documento como «aquí hay JavaScript», y el CSS
         esconde ese resumen solo en ese caso. Quien ejecuta JavaScript ve la
         página cargando —en blanco un instante, como cualquier aplicación— y
         quien no lo ejecuta lo sigue leyendo entero. Va aquí arriba, antes de
         que exista el <body>, para que la clase esté puesta cuando el navegador
         pinte el primer píxel; puesta más tarde, el destello ocurriría igual. -->
    <script>document.documentElement.className += ' con-js';</script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/logo/favicon.svg" />

    <title>Become — AI-native transformation</title>
    <meta name="description" content="Become es la consultora de transformación AI-native: rediseñamos el operating model para que la IA cambie cómo decide y opera la empresa." />

    <!-- Canonical de la home. Es a nivel de documento y no por ruta porque el
         sitio es una SPA: el servidor devuelve este mismo index.html para las
         32 URLs, así que aquí no puede haber un canonical distinto por página.
         Resolverlo de verdad exige prerenderizado; mientras tanto, el sitemap
         es lo que le dice a Google que las otras páginas existen. -->
    <link rel="canonical" href="https://meetbecome.com/es" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BECOME" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://meetbecome.com/es" />
    <meta property="og:title" content="Become — AI-native transformation" />
    <meta property="og:description" content="Rediseñamos cómo las empresas operan, deciden y crean valor alrededor de la IA." />
    <meta property="og:image" content="https://meetbecome.com/images/01-neural-network.webp" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Become — AI-native transformation" />
    <meta name="twitter:description" content="Rediseñamos cómo las empresas operan, deciden y crean valor alrededor de la IA." />
    <meta name="twitter:image" content="https://meetbecome.com/images/01-neural-network.webp" />

    <meta name="theme-color" content="#05070f" />
    <!-- ga -->
    <!-- Etiqueta de Google (gtag.js) — G-VXPXSDD12K.

         Va aquí, en el HTML de cada página, y no la inyecta el JavaScript de
         la aplicación. Dos razones:

         · El comprobador de Google mira el CÓDIGO FUENTE de la página. Una
           etiqueta añadida después por el bundle funciona para medir, pero
           «no se detecta» en la comprobación, y entonces no hay forma de
           saber si está bien puesta o no.
         · Cargando aquí empieza a medir antes: no espera a que descargue y
           arranque la aplicación.

         Lo que NO cambia es el consentimiento. La primera línea declara los
         cuatro permisos DENEGADOS, y eso se hace antes de que gtag.js llegue
         a ejecutarse: en ese estado la etiqueta no escribe una sola cookie.
         Solo si ya hay un «aceptado» guardado de una visita anterior se
         concede el de analítica —y solo ese, porque aquí no hay publicidad—.

         El panel de /admin se excluye: es una herramienta de trabajo, y las
         visitas de quien edita ensuciarían el informe. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      var becomeDenegado = {ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'denied'};
      gtag('consent','default',Object.assign({},becomeDenegado,{wait_for_update:500}));
      try{
        if(localStorage.getItem('become.consentimiento.v1')==='aceptado'){
          gtag('consent','update',Object.assign({},becomeDenegado,{analytics_storage:'granted'}));
        }
      }catch(e){}
      gtag('js', new Date());
      if(location.pathname.indexOf('/admin')!==0){
        gtag('config','G-VXPXSDD12K',{send_page_view:false,cookie_domain:'auto',cookie_flags:'SameSite=Lax;Secure',anonymize_ip:true});
      }
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VXPXSDD12K"></script>
    <!-- /ga -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
