# Escribe un borrador de artículo a partir del último informe del observatorio.
#
# El borrador se guarda con estado "borrador", que significa que existe en el
# panel de /admin y NO en la web. Nadie publica nada aquí: una persona lo abre,
# lo edita con el constructor y decide.
#
# Se eligió dejar el borrador en el panel en vez de abrir un pull request con el
# JSON. Revisar un artículo en un diff de JSON es incómodo hasta para quien lee
# diffs a diario, y el sitio ya tiene un editor que enseña el artículo como se
# va a ver. La revisión ocurre donde se entiende lo que se está revisando.

name: Borrador de artículo

on:
  schedule:
    # Cada dos martes a las 07:00 UTC. Cron no sabe de quincenas: se dispara
    # todos los martes y el propio trabajo se salta las semanas impares.
    - cron: '0 7 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: redactor
  cancel-in-progress: false

jobs:
  redactar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: ¿Toca esta semana?
        id: toca
        # En un disparo a mano siempre toca. En el automático, solo las semanas
        # pares del año, que es lo más parecido a «cada quince días» que se
        # puede expresar sin guardar estado en ningún sitio.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( $(date -u +%V) % 2 )) -eq 0 ]; then
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          else
            echo "Semana impar: le toca al observatorio, no al redactor."
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Comprobar que hay informe y con qué autenticarse
        if: steps.toca.outputs.seguir == 'si'
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "::error::Falta el secreto CLAUDE_CODE_OAUTH_TOKEN. Genéralo con 'claude setup-token'."
            exit 1
          fi
          if ! ls automatizacion/informes/*.md >/dev/null 2>&1; then
            echo "::error::No hay ningún informe del observatorio todavía. Lanza primero 'Observatorio de posicionamiento' — sin datos, el artículo lo elegiría el azar."
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.toca.outputs.seguir == 'si'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Lee automatizacion/redaccion.md y haz exactamente lo que dice ese documento. No hagas nada más.'
          claude_args: |
            --max-turns 80
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep"

      - name: Comprobar el borrador antes de guardarlo
        if: steps.toca.outputs.seguir == 'si'
        # Un JSON roto o un artículo marcado como publicado no pueden llegar al
        # repositorio. Lo primero rompe el panel; lo segundo publica en la web
        # algo que no ha leído nadie, que es justo lo que este diseño evita.
        run: |
          set -euo pipefail
          NUEVOS=$(git ls-files --others --exclude-standard src/content/insights/)
          if [ -z "$NUEVOS" ]; then
            echo "::warning::El redactor no dejó ningún borrador. Revisa el registro."
            exit 0
          fi
          for f in $NUEVOS; do
            node -e "
              const a = JSON.parse(require('fs').readFileSync('$f', 'utf8'));
              if (a.estado !== 'borrador') { console.error('$f no está marcado como borrador'); process.exit(1); }
              for (const l of ['es', 'en']) {
                const t = a[l] || {};
                if (!t.titulo || !t.slug || !(t.bloques || []).length) { console.error('$f: falta título, dirección o cuerpo en ' + l); process.exit(1); }
                if ((t.bloques || []).some((b) => b.tipo === 'imagen')) { console.error('$f: lleva un bloque de imagen, que apunta a un archivo que no existe'); process.exit(1); }
              }
              if (!/^\d{4}-\d{2}-\d{2}\$/.test(a.fecha || '')) { console.error('$f: fecha mal formada'); process.exit(1); }
              console.log('$f — ' + a.es.titulo);
            "
          done
          git add src/content/insights/
          git -c user.name='Redactor BECOME' \
              -c user.email='hello@meetbecome.com' \
              commit -m "Borrador de artículo (sin publicar, para revisar en /admin)"
          git push
          {
            echo "### Borrador listo para revisar"
            echo ""
            echo "Está en el panel: https://meetbecome.com/admin"
            echo "No se ha publicado — hay que abrirlo, revisarlo y decidir."
          } >> $GITHUB_STEP_SUMMARY

      - name: Si algo falló
        if: failure()
        run: |
          echo "::error::El redactor no pudo completarse. Si el motivo es de autenticación, renueva el token con 'claude setup-token' y sustituye el secreto CLAUDE_CODE_OAUTH_TOKEN."
