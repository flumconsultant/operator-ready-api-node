# Escribe y PUBLICA un artículo al día, a partir del informe del observatorio.
#
# Publica sin revisión humana previa. Es una decisión de quien firma los
# artículos, y cambia dónde vive el control: como no hay nadie leyendo entre la
# redacción y la web, el control es scripts/validar-articulo.mjs, y es
# mecánico. Todo lo que comprueba se eligió porque se puede comprobar sin
# criterio: autor, longitudes, los dos idiomas, preguntas frecuentes, rayas
# largas, muletillas y —la que más importa— que ninguna cifra viaje sin fuente.
#
# Un artículo que no pasa el guardián no se publica y el día se queda sin
# artículo. Ese es el comportamiento correcto: el coste de no publicar un día
# es cero, y el de publicar un dato inventado bajo el nombre de una persona
# real no se arregla borrándolo después.

name: Artículo diario

on:
  # El horario ya no vive aquí. La cadencia diaria la lleva una Routine de
  # Claude Code, que corre con la suscripción y no necesita el token de CI:
  # quien opera este sitio trabaja desde el navegador y no tiene la CLI
  # instalada, así que pedirle un `claude setup-token` era pedirle que montara
  # un taller para apretar un tornillo.
  #
  # Este workflow se queda como camino manual: si algún día existe el secreto
  # CLAUDE_CODE_OAUTH_TOKEN, se lanza desde la pestaña Actions y hace lo mismo.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: redactor
  cancel-in-progress: false

jobs:
  redactar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Comprobar que hay informe y con qué autenticarse
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "::error::Falta el secreto CLAUDE_CODE_OAUTH_TOKEN. Genéralo con 'claude setup-token'."
            exit 1
          fi
          if ! ls automatizacion/informes/*.md >/dev/null 2>&1; then
            echo "::error::No hay ningún informe del observatorio todavía. Lanza primero 'Observatorio de posicionamiento' — sin datos, el artículo lo elegiría el azar."
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Lee automatizacion/redaccion.md y haz exactamente lo que dice ese documento. No hagas nada más.'
          claude_args: |
            --max-turns 80
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(node scripts/validar-articulo.mjs:*)"

      - name: El guardián editorial
        # Lo único que separa lo que escribió el modelo de lo que lee un cliente.
        run: |
          set -euo pipefail
          NUEVOS=$(git ls-files --others --modified --exclude-standard src/content/insights/)
          if [ -z "$NUEVOS" ]; then
            echo "Hoy no había ningún hueco sin cubrir y no se escribió nada. Es un resultado válido."
            echo "Sin artículo hoy: no había tema nuevo." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "Revisando: $NUEVOS"
          node scripts/validar-articulo.mjs $NUEVOS
          echo "ARTICULOS<<EOF" >> "$GITHUB_ENV"
          echo "$NUEVOS" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Publicar
        if: env.ARTICULOS != ''
        run: |
          set -euo pipefail
          git add src/content/insights/
          git -c user.name='Carlos Andrés Ramírez' \
              -c user.email='hello@meetbecome.com' \
              commit -m "Artículo del $(date -u +%Y-%m-%d)"
          git push
          {
            echo "### Publicado"
            for f in $ARTICULOS; do node -e "const a=require('./$f');console.log('- '+a.es.titulo+' · '+a.estado)"; done
            echo ""
            echo "Estará en la web en unos minutos: https://meetbecome.com/es/insights"
          } >> $GITHUB_STEP_SUMMARY

      - name: Desplegar el sitio
        if: env.ARTICULOS != ''
        # El push de arriba usa GITHUB_TOKEN, y GitHub no dispara workflows con
        # commits hechos con ese token: sin esta llamada el artículo se queda en
        # el repositorio y no llega nunca a la web.
        env:
          GH_TOKEN: ${{ secrets.PANEL_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Sin PANEL_TOKEN no puedo lanzar el despliegue. El artículo está en el repositorio pero no en la web hasta el siguiente despliegue."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"${{ github.event.repository.default_branch }}"}' \
            && echo "Despliegue lanzado."

      - name: Si algo falló
        if: failure()
        run: |
          echo "::error::El redactor no pudo completarse. Si el motivo es de autenticación, renueva el token con 'claude setup-token' y sustituye el secreto CLAUDE_CODE_OAUTH_TOKEN."
