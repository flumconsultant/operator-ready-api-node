# Compila el sitio y lo sube a Hostinger en cada push.
#
# Por qué lftp y no una acción de terceros del marketplace: una acción de
# despliegue recibe las credenciales FTP del sitio en producción. lftp está en
# los repositorios de Ubuntu, el comando que se ejecuta está escrito aquí a la
# vista, y no hay una tercera parte que pueda cambiar lo que hace bajo el mismo
# número de versión.

name: Desplegar a Hostinger

on:
  push:
    branches:
      - main
      - claude/become-brand-image-kw83bw
  # Permite lanzarlo a mano desde la pestaña Actions sin tocar el código
  workflow_dispatch:

# Dos despliegues a la vez dejarían public_html a medias entre dos versiones.
# Se encolan, y no se cancela el que ya está subiendo archivos.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # Un despliegue completo tarda unos tres minutos. Veinte es margen de
    # sobra, y evita que un paso que se cuelgue bloquee la cola de despliegues
    # —que no se cancelan entre sí— durante horas.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Preparar las credenciales del correo
        # La contraseña del buzón no puede estar en el repositorio, y el
        # hosting compartido no tiene forma de leer variables de entorno desde
        # PHP. El punto intermedio es este: el archivo de configuración se
        # escribe aquí, en cada despliegue, a partir de los secretos.
        #
        # Va en base64 y no como literales PHP para no tener que escapar nada:
        # una contraseña con una comilla o una barra invertida —perfectamente
        # normal— rompería el archivo generado, y el fallo aparecería en
        # producción y no aquí.
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          set -euo pipefail
          if [ -z "${MAIL_USER:-}" ] || [ -z "${MAIL_PASSWORD:-}" ]; then
            echo "::error::Faltan los secretos MAIL_USER y/o MAIL_PASSWORD (Settings → Secrets and variables → Actions → pestaña Secrets). Sin ellos el formulario del sitio no puede enviar correo."
            exit 1
          fi
          mkdir -p dist/api
          # Testigo de un solo despliegue: autoriza la comprobación de salud
          # del correo que se hace al final, y caduca en cuanto se despliega
          # otra vez. No hace falta guardarlo en ningún sitio.
          MAIL_PING_TOKEN="$(openssl rand -hex 24)"
          echo "MAIL_PING_TOKEN=$MAIL_PING_TOKEN" >> "$GITHUB_ENV"
          echo "::add-mask::$MAIL_PING_TOKEN"
          MAIL_PING_TOKEN="$MAIL_PING_TOKEN" python3 - <<'PY' > dist/api/config.php
          import base64, json, os
          cfg = {
              'host':     os.environ.get('MAIL_HOST')  or 'smtp.hostinger.com',
              'port':     int(os.environ.get('MAIL_PORT') or 465),
              'user':     os.environ['MAIL_USER'],
              'password': os.environ['MAIL_PASSWORD'],
              'to':       os.environ.get('MAIL_TO') or os.environ['MAIL_USER'],
              'token':    os.environ['MAIL_PING_TOKEN'],
          }
          blob = base64.b64encode(json.dumps(cfg).encode()).decode()
          print("<?php return json_decode(base64_decode('%s'), true);" % blob)
          PY
          php -l dist/api/config.php >/dev/null 2>&1 || true
          echo "config.php generado ($(wc -c < dist/api/config.php) bytes) — destino: ${MAIL_TO:-$MAIL_USER}"

      - name: Comprobar que el build es publicable
        # Barato, y detecta el fallo más caro: subir un dist/ sin .htaccess deja
        # todas las rutas menos la home devolviendo 404, y desde fuera parece
        # que el sitio entero se ha roto.
        run: |
          for f in dist/index.html dist/.htaccess dist/sitemap.xml dist/robots.txt \
                   dist/llms.txt dist/api/contacto.php dist/api/config.php; do
            [ -s "$f" ] || { echo "Falta o está vacío: $f"; exit 1; }
          done
          echo "dist/ listo — $(du -sh dist | cut -f1)"

      # El 19 de agosto este paso se quedó colgado SEIS HORAS y GitHub canceló
      # el despliegue entero: `apt-get update` esperaba a un servidor de
      # paquetes que no contestaba, y sin límite de tiempo esperó hasta el
      # máximo permitido. El sitio se quedó en la versión anterior y el
      # despliegue no salió en rojo, salió en gris.
      #
      # Ahora: cinco minutos de techo, tres intentos, y si el mirror de Ubuntu
      # sigue sin contestar se dice en voz alta en vez de esperar en silencio.
      - name: Instalar lftp
        timeout-minutes: 5
        run: |
          set -u
          for intento in 1 2 3; do
            if sudo timeout 90 apt-get update -qq \
               && sudo timeout 120 apt-get install -y -qq lftp; then
              lftp --version | head -1
              exit 0
            fi
            echo "Intento $intento de instalar lftp sin éxito; reintentando en $((intento * 10))s"
            sleep $((intento * 10))
          done
          echo "::error::No se pudo instalar lftp: los repositorios de Ubuntu no responden."
          echo "No es un fallo del sitio ni del código. Vuelve a lanzar el despliegue"
          echo "desde la pestaña Actions con 'Re-run all jobs'."
          exit 1

      - name: Subir a public_html
        timeout-minutes: 6
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Variable opcional del repositorio. Ver la nota de abajo.
          TLS_RELAJADO: ${{ vars.FTP_TLS_RELAJADO }}
          # Opcional. Si se deja vacío, se detecta solo (ver abajo).
          FTP_DIR: ${{ vars.FTP_DIR }}
        run: |
          set -euo pipefail

          # Comprobación antes de conectar. El fallo típico aquí no es que
          # falten los secretos — es que FTP_HOST se guardó con algo que no es
          # un nombre de servidor puro: un "ftp://" delante, comillas, un
          # espacio pegado al copiar. lftp entonces intenta resolver ese texto
          # como si fuera un dominio y responde con un error de red genérico
          # ("Name or service not known") que no dice nada de esto. Aquí se
          # detecta antes y se explica en español.
          FALTA=""
          [ -z "${FTP_HOST:-}" ] && FALTA="$FALTA FTP_HOST"
          [ -z "${FTP_USER:-}" ] && FALTA="$FALTA FTP_USER"
          [ -z "${FTP_PASSWORD:-}" ] && FALTA="$FALTA FTP_PASSWORD"
          if [ -n "$FALTA" ]; then
            echo "::error::Falta(n) estos secretos en Settings → Secrets and variables → Actions:$FALTA"
            exit 1
          fi
          if [[ "$FTP_HOST" == *"://"* ]]; then
            echo "::error::FTP_HOST tiene '://' delante (algo como 'ftp://…'). Debe ser solo el nombre del servidor, por ejemplo 'ftp.meetbecome.com', sin ftp:// ni ftps:// delante."
            exit 1
          fi
          if [[ "$FTP_HOST" == *" "* ]] || [[ "$FTP_HOST" == *"'"* ]] || [[ "$FTP_HOST" == *'"'* ]]; then
            echo "::error::FTP_HOST tiene un espacio o una comilla dentro. Vuelve a pegarlo en el secreto sin nada alrededor: solo el nombre del servidor."
            exit 1
          fi

          # FTPS obligatorio: sin esto lftp negociaría FTP en claro y la
          # contraseña del hosting viajaría legible por la red.
          VERIFICAR=true
          if [ "${TLS_RELAJADO:-}" = "true" ]; then
            echo "::warning::Verificación del certificado desactivada. El tráfico sigue cifrado, pero no se comprueba que el servidor sea quien dice ser."
            VERIFICAR=false
          fi
          # Se imprime tal cual, para no depender de activar el modo de
          # depuración de GitHub y leer líneas ##[debug]: si esto dice
          # "(vacía)", la variable FTP_TLS_RELAJADO no está llegando — lo más
          # probable es que se haya guardado como Secret en vez de Variable,
          # que son dos pestañas distintas en la misma pantalla y es fácil
          # confundirlas.
          echo "FTP_TLS_RELAJADO recibido: '${TLS_RELAJADO:-(vacía)}'  → verificación de certificado: $([ "$VERIFICAR" = true ] && echo activada || echo desactivada)"

          # ¿Dónde hay que dejar los archivos?
          #
          # La cuenta FTP de este sitio está limitada a la carpeta del dominio
          # (el usuario es del tipo 'uXXXXXXX.meetbecome.com'), así que al
          # conectar ya estamos DENTRO de public_html: el destino es ".".
          #
          # Antes esto se detectaba solo, probando si existía una carpeta
          # llamada public_html. Fue un error y costó caro: en cuanto por
          # cualquier motivo apareció un public_html dentro de public_html, la
          # prueba pasó a dar "sí" y los despliegues empezaron a dejar el sitio
          # en public_html/public_html — una carpeta que el servidor no publica.
          # Desde fuera el despliegue salía en verde y el sitio se quedaba
          # congelado en la versión anterior, que es el peor fallo posible:
          # silencioso. Una detección que puede acertar o fallar según lo que
          # haya en el disco es peor que un valor fijo y explícito.
          DESTINO="${FTP_DIR:-.}"

          echo "Subiendo a: $DESTINO"

          # Una conexión, y nada que no sea subir archivos.
          #
          # Este paso ha tenido dos versiones peores, las dos por querer dejar
          # constancia de en qué carpeta aterrizaba:
          #
          #   · Tres invocaciones de lftp aparte para listar. Cuatro conexiones
          #     seguidas donde antes había una, y este hosting compartido no
          #     rechaza el exceso: lo deja colgado. Seis minutos hasta agotar
          #     el tiempo límite.
          #   · Un 'cls' dentro de la misma sesión. Parecía gratis y no lo era:
          #     en FTP un listado abre un canal de datos propio, y con la
          #     cuenta limitada ese canal extra se queda sin reintentos y
          #     tumba la sesión entera antes de subir un solo archivo.
          #
          # La carpeta de destino ya no hace falta comprobarla aquí: el paso
          # siguiente le pide la página al dominio de verdad, que es la única
          # prueba que de verdad importa. Un diagnóstico que rompe el proceso
          # que vigila es peor que no tener diagnóstico.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate $VERIFICAR;
            set net:timeout 20;

            # Margen para el estrangulamiento del hosting compartido: cuando
            # rechaza una conexión por exceso, suele aceptarla unos segundos
            # después. Con 3 reintentos inmediatos el despliegue se rendía.
            set net:max-retries 6;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1.5;

            # Sin esto, lftp pide al servidor el listado normal, que NO incluye
            # los archivos que empiezan por punto. Y lo que no ve, no lo borra:
            # --delete dejaba huérfanos los .htaccess de versiones anteriores
            # creyendo que la carpeta ya estaba limpia.
            set ftp:list-options -a;

            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';

            # Un despliegue anterior dejó un .htaccess dentro de assets/ para
            # cachear un año. El servidor empezó a responder 403 a TODA la
            # carpeta: el sitio servía su HTML y no su código, o sea, en blanco.
            # Quitarlo del repositorio no bastaba, porque el archivo ya vivía en
            # el servidor y el espejo no lo veía. Esto lo borra explícitamente;
            # -f para que no proteste cuando ya no exista, que es lo que pasará
            # de ahora en adelante.
            rm -f $DESTINO/assets/.htaccess;

            # Y los permisos de la carpeta. Un directorio que el servidor web
            # no puede leer devuelve 403 en todo lo que hay dentro, que es
            # exactamente el síntoma, y no se arregla borrando archivos. Si ya
            # estaban bien, esto no cambia nada; si no, el sitio vuelve.
            chmod -R 755 $DESTINO/assets;

            # 1. El bundle con hash va con --delete: esa carpeta es solo nuestra,
            #    y sin borrar acumularía todos los bundles de todos los despliegues
            #    para siempre.
            mirror --reverse --delete --parallel=2 --verbose dist/assets/ $DESTINO/assets/;

            # 2. El resto va SIN --delete, a propósito. Si hubiera algo más en
            #    public_html —un archivo de verificación de dominio, un correo,
            #    cualquier cosa puesta a mano— borrarlo desde aquí sería
            #    destruir trabajo que este repositorio no conoce.
            mirror --reverse --parallel=2 --verbose --exclude-glob assets/* dist/ $DESTINO/;
          "

      - name: Comprobar que lo subido es lo que se publica
        # Un despliegue que sube los archivos a una carpeta que el servidor no
        # publica termina en verde igual que uno correcto, y el sitio se queda
        # congelado en la versión anterior sin que nada lo avise. Pasó, y costó
        # varias horas encontrarlo. La única comprobación que lo detecta es
        # pedirle la página al dominio de verdad, por HTTP, y ver si responde
        # con lo que se acaba de subir.
        run: |
          set -uo pipefail

          # El nombre del bundle lleva un hash del contenido: si el sitio
          # publicado apunta a otro archivo, está sirviendo otra versión.
          #
          # 'sed -n 1p' y no 'head -1': head cierra la tubería en cuanto tiene
          # su línea, grep muere con SIGPIPE y con pipefail activo eso cuenta
          # como fallo del paso entero aunque la búsqueda haya ido bien. Pasó
          # en el primer intento de esta comprobación: abortaba antes de
          # imprimir nada. sed lee hasta el final, así que no hay tubería rota.
          LOCAL=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | sed -n 1p || true)
          if [ -z "$LOCAL" ]; then
            echo "::warning::No se pudo leer el nombre del bundle en dist/index.html; se omite la comprobación."
            exit 0
          fi

          # -L es obligatorio: la raíz responde 301 hacia /es, y sin seguir la
          # redirección curl devuelve un cuerpo vacío y la comprobación se
          # queda sin nada que mirar. La cadena del final evita que conteste
          # una copia guardada del CDN.
          REMOTO_HTML=$(curl -fsSL --max-time 30 \
            -A 'despliegue-become/1.0' \
            "https://meetbecome.com/?nocache=${GITHUB_SHA}" || true)
          REMOTO=$(printf '%s' "$REMOTO_HTML" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | sed -n 1p || true)

          echo "Bundle recién compilado : $LOCAL"
          echo "Bundle que sirve el sitio: ${REMOTO:-(no se pudo leer)}"

          if [ -z "$REMOTO" ]; then
            echo "::warning::No se pudo leer https://meetbecome.com para comprobarlo. Revisa el sitio a mano."
            exit 0
          fi
          if [ "$LOCAL" != "$REMOTO" ]; then
            echo "::error::El sitio publicado NO es el que se acaba de subir. Los archivos han ido a parar a una carpeta que el servidor no publica. Revisa arriba, en '── Dónde estamos en el FTP ──', cuál es la carpeta real, y ponla en la variable FTP_DIR del repositorio (Settings → Secrets and variables → Actions → pestaña Variables)."
            exit 1
          fi
          echo "El sitio publicado es esta versión."

          # ── Lo que el servidor hace con las cabeceras ──
          #
          # El bundle lleva hash en el nombre, así que comprobar que cambió
          # solo prueba que el HTML es nuevo. Lo que NO se veía es qué hace el
          # servidor con lo demás: durante días sirvió el logotipo viejo y unas
          # caducidades de caché que ya no estaban en el .htaccess, porque las
          # respuestas venían de una caché intermedia. Desde fuera el
          # despliegue estaba en verde y la auditoría seguía quejándose de algo
          # ya arreglado.
          #
          # Estas dos comprobaciones no detienen el despliegue —no todo depende
          # de nosotros— pero dejan el dato escrito en el registro en vez de
          # obligar a deducirlo.
          # Se mide el peso REAL que viaja por el cable, no la cabecera que lo
          # anuncia. La primera versión de esto usaba `curl -I`, que no manda
          # Accept-Encoding: el servidor respondía sin comprimir —con toda la
          # razón, nadie se lo había pedido— y la comprobación denunciaba un
          # problema que no existía. Comparar bytes bajados contra bytes en
          # disco no admite esa confusión.
          #
          # Sin --compressed a propósito: así curl NO descomprime, y
          # size_download es lo que de verdad cruzó la red.
          BYTES_LOCAL=$(stat -c%s "dist/${LOCAL}")
          # Se piden también estado y tipo. Sin ellos, «pesa menos de lo
          # esperado» es ambiguo: puede ser compresión o puede ser que el
          # servidor esté contestando otra cosa —una página de error, el
          # index.html de la SPA— con un peso que parece una compresión
          # buenísima. Pasó: 2.482 bytes donde debía haber 106.000.
          # El mismo User-Agent de navegador en las dos peticiones, y no es
          # cosmético: la del HTML lo llevaba y respondía 200; estas dos no, y
          # respondían 403 con una página de bloqueo de 2.482 bytes. El
          # cortafuegos del hosting rechaza a curl cuando pide archivos
          # estáticos. Se dio por caído un sitio que estaba sirviendo
          # perfectamente a sus visitantes, y se persiguieron durante una hora
          # dos causas inventadas —un .htaccess y unos permisos— que no lo eran.
          #
          # Una comprobación tiene que pedir las cosas como las pide un
          # visitante. Si no, mide su propio reflejo.
          # Tres cosas que una petición de verdad lleva y `curl` a secas no:
          # el User-Agent de un navegador, un Referer del propio dominio y un
          # Accept. Sin el Referer, la protección anti-enlazado de Hostinger
          # responde 403 a los archivos estáticos —es su función: impedir que
          # otro sitio cuelgue de los tuyos— y la comprobación leía ese bloqueo
          # como si la web estuviera caída.
          #
          # Costó una hora y dos arreglos a ciegas descubrirlo: se borró un
          # .htaccess y se corrigieron unos permisos que no tenían nada que ver,
          # mientras el sitio servía con total normalidad a sus visitantes. La
          # pista estaba a la vista desde el principio: el 403 seguía igual
          # después de cada arreglo, y eso solo puede significar que el problema
          # está en quien pregunta.
          NAVEGADOR='Mozilla/5.0 (Linux; Android 11; moto g power) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36'
          COMO_UN_VISITANTE=(-A "$NAVEGADOR" -e 'https://meetbecome.com/es' -H 'Accept: */*')

          LEIDO=$(curl -sS --max-time 20 -o /dev/null \
            "${COMO_UN_VISITANTE[@]}" \
            -H 'Accept-Encoding: gzip, br' \
            -w '%{http_code} %{content_type} %{size_download}' \
            "https://meetbecome.com/${LOCAL}" || echo "000 - 0")
          ESTADO=$(printf '%s' "$LEIDO" | cut -d' ' -f1)
          TIPO=$(printf '%s' "$LEIDO" | cut -d' ' -f2)
          BYTES_RED=$(printf '%s' "$LEIDO" | cut -d' ' -f3)
          CACHE=$(curl -sSI --max-time 20 "${COMO_UN_VISITANTE[@]}" "https://meetbecome.com/${LOCAL}" \
            | grep -i '^cache-control:' | tr -d '\r' || true)

          echo "Bundle en disco  : ${BYTES_LOCAL} B"
          echo "Bundle por la red: ${BYTES_RED} B  ·  estado ${ESTADO}  ·  tipo ${TIPO}"
          echo "${CACHE:-cache-control: (ninguna)}"

          if [ "$ESTADO" = "403" ]; then
            # Sigue sin poder afirmarse nada del sitio: 403 aquí es el
            # cortafuegos del hosting, no la web. Se dice y se sigue.
            echo "::warning::403 al pedir el bundle, incluso pidiéndolo como lo pide un navegador. Es el cortafuegos del hosting bloqueando peticiones desde fuera de un navegador real; NO significa que la web esté mal. Compruébala abriéndola. Lo que sí queda sin medir es si el JavaScript viaja comprimido."
          elif [ "$ESTADO" != "200" ]; then
            echo "::error::El bundle no se sirve: el servidor responde ${ESTADO} en /${LOCAL}. El sitio está cargando el HTML pero no su código."
            exit 1
          else
            case "$TIPO" in
              *javascript*|*ecmascript*) : ;;
              *) echo "::error::El servidor devuelve '${TIPO}' donde debería haber JavaScript en /${LOCAL}. Alguna regla del .htaccess está desviando las peticiones a assets/." ; exit 1 ;;
            esac

            # Un bundle de JavaScript comprime a menos de la mitad. Si lo que
            # viaja pesa casi lo mismo que el archivo, no se está comprimiendo.
            if [ "${BYTES_RED:-0}" -eq 0 ]; then
              echo "::warning::No se pudo medir el peso transferido. Compruébalo a mano."
            elif [ "$BYTES_RED" -gt $((BYTES_LOCAL * 70 / 100)) ]; then
              echo "::warning::El JavaScript viaja SIN COMPRIMIR: ${BYTES_RED} B de ${BYTES_LOCAL} B. En móvil eso es más de un segundo perdido. Revisa que el bloque mod_deflate del .htaccess incluya text/javascript."
            else
              echo "Comprimido al $((BYTES_RED * 100 / BYTES_LOCAL)) % de su tamaño."
            fi
          fi

      - name: Comprobar que el correo del formulario funciona
        # Conecta y se autentica contra el servidor de correo, sin enviar
        # ningún mensaje. Es lo único que distingue "el formulario está
        # publicado" de "el formulario sirve para algo": un buzón con la
        # contraseña caducada deja el sitio impecable por fuera mientras cada
        # mensaje que alguien escribe se pierde sin que nadie se entere.
        run: |
          set -uo pipefail
          RES=$(curl -sS --max-time 40 -X POST \
                  -H 'Content-Type: application/json' \
                  -d "{\"ping\":\"${MAIL_PING_TOKEN}\"}" \
                  "https://meetbecome.com/api/contacto.php" || true)
          echo "Respuesta: ${RES:-(sin respuesta)}"

          case "$RES" in
            *'"ok":true'*)
              echo "El formulario puede enviar correo." ;;
            '')
              echo "::warning::No hubo respuesta de la comprobación. Revisa el formulario a mano." ;;
            *)
              ETAPA=$(printf '%s' "$RES" | sed -n 's/.*"stage":"\([^"]*\)".*/\1/p')
              echo "::error::El formulario NO puede enviar correo. Falló en la etapa: ${ETAPA:-desconocida}. 'auth-clave' = la contraseña de MAIL_PASSWORD no es la del buzón; 'auth-usuario' = la dirección de MAIL_USER no existe; 'conexion' = el servidor no alcanza a MAIL_HOST; 'config' = el despliegue no dejó bien las credenciales. El motivo completo está en public_html/api/errores.log."
              exit 1 ;;
          esac

      - name: Resumen
        run: |
          echo "### Desplegado a producción" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Sitio: https://meetbecome.com" >> $GITHUB_STEP_SUMMARY
          echo "- Páginas en el sitemap: $(grep -c '<loc>' dist/sitemap.xml)" >> $GITHUB_STEP_SUMMARY
