# Compila el sitio y lo sube a Hostinger en cada push.
#
# Por qué lftp y no una acción de terceros del marketplace: una acción de
# despliegue recibe las credenciales FTP del sitio en producción. lftp está en
# los repositorios de Ubuntu, el comando que se ejecuta está escrito aquí a la
# vista, y no hay una tercera parte que pueda cambiar lo que hace bajo el mismo
# número de versión.

name: Desplegar a Hostinger

# Solo main. Antes también desplegaba desde la rama de trabajo, y con el panel
# de artículos en marcha eso se convirtió en un fallo: config-panel.php guarda
# la rama del despliegue que lo generó, así que la rama a la que el panel
# escribe los artículos era «la del último despliegue». Dos despliegues
# seguidos desde ramas distintas y los artículos empiezan a guardarse en una
# rama que no es la que está publicada, sin que nada lo avise.
on:
  push:
    branches:
      - main
      # Red de seguridad para la rutina que publica los artículos: una rutina
      # solo tiene garantizado el push a ramas que empiezan por claude/. Si
      # algún día se le rechaza el push a main, publica aquí y el sitio sale
      # igual, en vez de quedarse el artículo escrito y sin desplegar.
      - claude/insights-diario
  # Permite lanzarlo a mano desde la pestaña Actions sin tocar el código
  workflow_dispatch:
    inputs:
      difundir:
        description: 'Reenviar por correo un artículo ya publicado (nombre del archivo, p. ej. que-puede-hacer-un-agente-sin-supervision.json). Vacío = comportamiento normal.'
        required: false
        default: ''

# Dos despliegues a la vez dejarían public_html a medias entre dos versiones.
# Se encolan, y no se cancela el que ya está subiendo archivos.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # Un despliegue completo tarda unos tres minutos. Veinte es margen de
    # sobra, y evita que un paso que se cuelgue bloquee la cola de despliegues
    # —que no se cancelan entre sí— durante horas.
    # 30 y no 20. La compilación tarda unos cuatro minutos y la subida tiene
    # dieciséis de presupuesto propio: con veinte, el trabajo entero moría por
    # tiempo justo cuando la subida entraba en su tercer intento. Pasó el 22 de
    # agosto y se llevó el artículo del día.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa, y no el clon de un solo commit que trae por
          # defecto. El aviso por correo compara el commit anterior con el
          # actual para saber qué artículo es nuevo, y en un clon superficial
          # ese commit anterior sencillamente no existe: la comparación falla,
          # el error se traga, y el paso informa de que no hay artículos nuevos.
          #
          # Eso es lo que pasó con «Qué puede hacer un agente sin supervisión»:
          # el despliegue terminó en verde y nadie recibió nada.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Antes de compilar nada, porque un fallo de plazos que se descubre a los
      # veinte minutos se descubre en gris y no se ve. Ver el comentario largo
      # dentro del propio script.
      - name: Comprobar que los plazos del despliegue cuadran
        run: node scripts/comprobar-plazos.mjs

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar el navegador del prerenderizado
        # El paso de prerenderizado monta cada página en un navegador de verdad
        # para sacar su texto. El runner no trae ninguno instalado, así que sin
        # esta línea el build se cae con «Executable doesn't exist», y con
        # `continue-on-error` sería peor: se publicarían 72 páginas sin texto
        # sin que nadie se entere.
        # Solo chromium: instalar los tres navegadores son tres minutos y dos
        # de ellos no se usan nunca.
        run: npx playwright install --with-deps chromium

      - name: Compilar
        run: npm run build

      # El QA de lenguaje va después del prerenderizado y antes de subir nada:
      # revisa el HTML que se va a publicar, que es el único sitio donde se
      # puede saber qué lee una persona. Si encuentra una palabra importada o
      # un anglicismo accidental, el despliegue se detiene aquí y el sitio sigue
      # sirviendo la versión anterior, que es preferible a publicar media lengua.
      # El catálogo antes que nada: no depende de compilar, y si una llave
      # nueva no está declarada conviene saberlo antes de gastar diez minutos.
      - name: El catálogo cuadra con lo que hay
        run: node scripts/catalogo.mjs

      # Tras compilar, porque escribe en dist/. Avisa de lo que falta por
      # escribir y no detiene nada: un hueco de conocimiento solo lo puede
      # llenar una persona, y parar el sitio por eso sería castigar al sitio
      # por algo que no depende de él.
      - name: Compilar el conocimiento
        run: node scripts/conocimiento.mjs

      - name: QA de lenguaje del español publicado
        run: node scripts/qa-lenguaje.mjs

      # Y el gate de publicación: títulos, descripciones y h1 únicos, h1 en el
      # HTML servido, datos estructurados válidos, imágenes con alt y medidas, y
      # las seis industrias enlazando de verdad. Va aquí por el mismo motivo que
      # el QA: antes de subir, sobre el HTML que se iba a publicar.
      # El destello de texto sin maquetar tenía guardián y no lo ejecutaba nadie:
      # había que acordarse. Un guardián que depende de la memoria es media
      # protección, y esta comprobación existe justamente porque cuatro
      # controles automáticos dieron verde a algo que se veía a simple vista.
      # Sin CHROMIUM_PATH: aquí lo instaló Playwright unos pasos más arriba y
      # sabe dónde está. Fijar una ruta a mano fue un error mío —era la del
      # entorno donde lo escribí, que en este runner no existe— y habría hecho
      # fallar el despliegue en el primer intento.
      - name: QA de lenguaje del inglés publicado
        # El guardián español busca palabras sin traducir. Este busca otra cosa,
        # porque el lado inglés ya está limpio de español: busca copy que suene
        # como el de cualquier otro proveedor de IA. «Unlock the power of AI»,
        # «cutting-edge», «seamless». Ninguna está mal; todas son
        # intercambiables, y una consultora que suena como las demás tiene que
        # explicar en la reunión por qué es distinta.
        run: node scripts/qa-english.mjs

      - name: Sin destello de texto sin maquetar
        run: node scripts/verificar-destello.mjs

      # Lo que decide si Google indexa: canonical autorreferente, hreflang
      # recíproco, un H1, la marca una sola vez en el título, ningún enlace
      # interno hacia una dirección vieja y ninguna página anunciada en el
      # sitemap que no esté enlazada desde su índice.
      #
      # Corre antes de subir a propósito. Las mismas comprobaciones contra el
      # sitio ya publicado llegarían tarde: el error estaría en producción.
      - name: QA de indexación
        run: node scripts/qa-indexacion.mjs

      - name: Gate de publicación
        run: node scripts/gate-seo.mjs

      - name: Preparar las credenciales del correo
        # La contraseña del buzón no puede estar en el repositorio, y el
        # hosting compartido no tiene forma de leer variables de entorno desde
        # PHP. El punto intermedio es este: el archivo de configuración se
        # escribe aquí, en cada despliegue, a partir de los secretos.
        #
        # Va en base64 y no como literales PHP para no tener que escapar nada:
        # una contraseña con una comilla o una barra invertida —perfectamente
        # normal— rompería el archivo generado, y el fallo aparecería en
        # producción y no aquí.
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_TO: ${{ vars.MAIL_TO }}
        run: |
          set -euo pipefail
          if [ -z "${MAIL_USER:-}" ] || [ -z "${MAIL_PASSWORD:-}" ]; then
            echo "::error::Faltan los secretos MAIL_USER y/o MAIL_PASSWORD (Settings → Secrets and variables → Actions → pestaña Secrets). Sin ellos el formulario del sitio no puede enviar correo."
            exit 1
          fi
          mkdir -p dist/api
          # Testigo de un solo despliegue: autoriza la comprobación de salud
          # del correo que se hace al final, y caduca en cuanto se despliega
          # otra vez. No hace falta guardarlo en ningún sitio.
          MAIL_PING_TOKEN="$(openssl rand -hex 24)"
          echo "MAIL_PING_TOKEN=$MAIL_PING_TOKEN" >> "$GITHUB_ENV"
          echo "::add-mask::$MAIL_PING_TOKEN"
          MAIL_PING_TOKEN="$MAIL_PING_TOKEN" python3 - <<'PY' > dist/api/config.php
          import base64, json, os
          cfg = {
              'host':     os.environ.get('MAIL_HOST')  or 'smtp.hostinger.com',
              'port':     int(os.environ.get('MAIL_PORT') or 465),
              'user':     os.environ['MAIL_USER'],
              'password': os.environ['MAIL_PASSWORD'],
              'to':       os.environ.get('MAIL_TO') or os.environ['MAIL_USER'],
              'token':    os.environ['MAIL_PING_TOKEN'],
          }
          blob = base64.b64encode(json.dumps(cfg).encode()).decode()
          print("<?php return json_decode(base64_decode('%s'), true);" % blob)
          PY
          php -l dist/api/config.php >/dev/null 2>&1 || true
          echo "config.php generado ($(wc -c < dist/api/config.php) bytes) — destino: ${MAIL_TO:-$MAIL_USER}"

      - name: Generar la configuración del panel de artículos
        # Las contraseñas del panel llegan en claro dentro del secreto —que es
        # donde tienen que estar, cifradas y sin que nadie pueda volver a
        # leerlas desde la interfaz— y salen de aquí convertidas en hashes.
        # El servidor nunca llega a guardar una contraseña legible: si alguien
        # se hiciera con config-panel.php, no obtendría con qué entrar.
        env:
          PANEL_USUARIOS: ${{ secrets.PANEL_USUARIOS }}
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PANEL_USUARIOS:-}" ] || [ -z "${PANEL_TOKEN:-}" ]; then
            echo "::warning::Sin los secretos PANEL_USUARIOS y PANEL_TOKEN, /admin no dejará entrar a nadie. El resto del sitio se despliega igual."
            # Un marcador vacío para que el archivo exista y el panel pueda
            # decir «falta configurar» en vez de dar un error de servidor.
            printf '<?php return [];\n' > dist/api/config-panel.php
          else
            PANEL_RAMA='${{ github.event.repository.default_branch }}' php -r '
              $rama = getenv("PANEL_RAMA") ?: "main";
              $usuarios = [];
              foreach (preg_split("/\r?\n/", (string) getenv("PANEL_USUARIOS")) as $linea) {
                  $linea = trim($linea);
                  if ($linea === "" || $linea[0] === "#") continue;
                  $partes = array_map("trim", explode("|", $linea));
                  if (count($partes) < 2 || $partes[0] === "" || $partes[1] === "") continue;
                  $usuarios[strtolower($partes[0])] = [
                      "hash"   => password_hash($partes[1], PASSWORD_DEFAULT),
                      "nombre" => $partes[2] ?? $partes[0],
                  ];
              }
              if (!$usuarios) { fwrite(STDERR, "PANEL_USUARIOS no tiene ninguna línea válida\n"); exit(1); }
              $cfg = [
                  "repo"     => getenv("GITHUB_REPOSITORY"),
                  "rama"     => $rama,
                  "token"    => getenv("PANEL_TOKEN"),
                  /* La clave que firma las sesiones se deriva del token en vez de
                     pedir otro secreto más. Consecuencia buscada: cambiar el token
                     invalida todas las sesiones abiertas, que es lo que se quiere
                     el día que haya que revocarlo. */
                  "secreto"  => hash("sha256", getenv("PANEL_TOKEN") . "|sesiones-del-panel"),
                  "usuarios" => $usuarios,
              ];
              $blob = base64_encode(json_encode($cfg, JSON_UNESCAPED_UNICODE));
              file_put_contents("dist/api/config-panel.php",
                  "<?php return json_decode(base64_decode(\"$blob\"), true);\n");
              fwrite(STDERR, sprintf("config-panel.php generado — %d usuario(s), rama %s\n", count($usuarios), $rama));
            '
          fi
          php -l dist/api/config-panel.php >/dev/null

      - name: Generar la configuración de la lista de correo
        env:
          BD_HOST: ${{ secrets.BD_HOST }}
          BD_BASE: ${{ secrets.BD_BASE }}
          BD_USUARIO: ${{ secrets.BD_USUARIO }}
          BD_CLAVE: ${{ secrets.BD_CLAVE }}
          DIFUSION_TOKEN: ${{ secrets.DIFUSION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BD_BASE:-}" ] || [ -z "${BD_USUARIO:-}" ] || [ -z "${BD_CLAVE:-}" ]; then
            echo "::warning::Sin los secretos BD_* el formulario de suscripción dirá que no está configurado. El resto del sitio se despliega igual."
            printf '<?php return [];\n' > dist/api/config-datos.php
          else
            python3 - <<'PY' > dist/api/config-datos.php
          import base64, json, os
          cfg = {
              'host':    os.environ.get('BD_HOST') or 'localhost',
              'base':    os.environ['BD_BASE'],
              'usuario': os.environ['BD_USUARIO'],
              'clave':   os.environ['BD_CLAVE'],
              'difusion': os.environ.get('DIFUSION_TOKEN') or '',
          }
          blob = base64.b64encode(json.dumps(cfg).encode()).decode()
          print("<?php return json_decode(base64_decode('%s'), true);" % blob)
          PY
            echo "config-datos.php generado — base ${BD_BASE}"
          fi
          php -l dist/api/config-datos.php >/dev/null

      - name: Comprobar que el build es publicable
        # Barato, y detecta el fallo más caro: subir un dist/ sin .htaccess deja
        # todas las rutas menos la home devolviendo 404, y desde fuera parece
        # que el sitio entero se ha roto.
        run: |
          for f in dist/index.html dist/.htaccess dist/sitemap.xml dist/robots.txt \
                   dist/llms.txt dist/api/contacto.php dist/api/config.php \
                   dist/api/panel.php dist/api/config-panel.php \
                   dist/api/suscripcion.php dist/api/correo.php dist/api/config-datos.php; do
            [ -s "$f" ] || { echo "Falta o está vacío: $f"; exit 1; }
          done
          echo "dist/ listo — $(du -sh dist | cut -f1)"

      # El 19 de agosto este paso se quedó colgado SEIS HORAS y GitHub canceló
      # el despliegue entero: `apt-get update` esperaba a un servidor de
      # paquetes que no contestaba, y sin límite de tiempo esperó hasta el
      # máximo permitido. El sitio se quedó en la versión anterior y el
      # despliegue no salió en rojo, salió en gris.
      #
      # Ahora: cinco minutos de techo, tres intentos, y si el mirror de Ubuntu
      # sigue sin contestar se dice en voz alta en vez de esperar en silencio.
      - name: Instalar lftp
        timeout-minutes: 5
        run: |
          set -u
          for intento in 1 2 3; do
            if sudo timeout 90 apt-get update -qq \
               && sudo timeout 120 apt-get install -y -qq lftp; then
              lftp --version | head -1
              exit 0
            fi
            echo "Intento $intento de instalar lftp sin éxito; reintentando en $((intento * 10))s"
            sleep $((intento * 10))
          done
          echo "::error::No se pudo instalar lftp: los repositorios de Ubuntu no responden."
          echo "No es un fallo del sitio ni del código. Vuelve a lanzar el despliegue"
          echo "desde la pestaña Actions con 'Re-run all jobs'."
          exit 1

      - name: Subir a public_html
        # 22 y no 16. El presupuesto tiene que caber en el paso, y no cabía:
        # tres intentos de cinco minutos más las esperas de 45 y 90 segundos
        # suman diecisiete y medio. El 22 de agosto la subida se cortó a los
        # 16:12 —en mitad del tercer intento— y el artículo del día se quedó
        # escrito en el repositorio sin llegar a la web, con el despliegue
        # marcado como cancelado en vez de fallido, que es peor porque no
        # parece un error. Ahora el paso dura más que lo que programa.
        timeout-minutes: 22
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Variable opcional del repositorio. Ver la nota de abajo.
          TLS_RELAJADO: ${{ vars.FTP_TLS_RELAJADO }}
          # Opcional. Si se deja vacío, se detecta solo (ver abajo).
          FTP_DIR: ${{ vars.FTP_DIR }}
        run: |
          set -euo pipefail

          # Comprobación antes de conectar. El fallo típico aquí no es que
          # falten los secretos — es que FTP_HOST se guardó con algo que no es
          # un nombre de servidor puro: un "ftp://" delante, comillas, un
          # espacio pegado al copiar. lftp entonces intenta resolver ese texto
          # como si fuera un dominio y responde con un error de red genérico
          # ("Name or service not known") que no dice nada de esto. Aquí se
          # detecta antes y se explica en español.
          FALTA=""
          [ -z "${FTP_HOST:-}" ] && FALTA="$FALTA FTP_HOST"
          [ -z "${FTP_USER:-}" ] && FALTA="$FALTA FTP_USER"
          [ -z "${FTP_PASSWORD:-}" ] && FALTA="$FALTA FTP_PASSWORD"
          if [ -n "$FALTA" ]; then
            echo "::error::Falta(n) estos secretos en Settings → Secrets and variables → Actions:$FALTA"
            exit 1
          fi
          if [[ "$FTP_HOST" == *"://"* ]]; then
            echo "::error::FTP_HOST tiene '://' delante (algo como 'ftp://…'). Debe ser solo el nombre del servidor, por ejemplo 'ftp.meetbecome.com', sin ftp:// ni ftps:// delante."
            exit 1
          fi
          if [[ "$FTP_HOST" == *" "* ]] || [[ "$FTP_HOST" == *"'"* ]] || [[ "$FTP_HOST" == *'"'* ]]; then
            echo "::error::FTP_HOST tiene un espacio o una comilla dentro. Vuelve a pegarlo en el secreto sin nada alrededor: solo el nombre del servidor."
            exit 1
          fi

          # FTPS obligatorio: sin esto lftp negociaría FTP en claro y la
          # contraseña del hosting viajaría legible por la red.
          VERIFICAR=true
          if [ "${TLS_RELAJADO:-}" = "true" ]; then
            echo "::warning::Verificación del certificado desactivada. El tráfico sigue cifrado, pero no se comprueba que el servidor sea quien dice ser."
            VERIFICAR=false
          fi
          # Se imprime tal cual, para no depender de activar el modo de
          # depuración de GitHub y leer líneas ##[debug]: si esto dice
          # "(vacía)", la variable FTP_TLS_RELAJADO no está llegando — lo más
          # probable es que se haya guardado como Secret en vez de Variable,
          # que son dos pestañas distintas en la misma pantalla y es fácil
          # confundirlas.
          echo "FTP_TLS_RELAJADO recibido: '${TLS_RELAJADO:-(vacía)}'  → verificación de certificado: $([ "$VERIFICAR" = true ] && echo activada || echo desactivada)"

          # ¿Dónde hay que dejar los archivos?
          #
          # La cuenta FTP de este sitio está limitada a la carpeta del dominio
          # (el usuario es del tipo 'uXXXXXXX.meetbecome.com'), así que al
          # conectar ya estamos DENTRO de public_html: el destino es ".".
          #
          # Antes esto se detectaba solo, probando si existía una carpeta
          # llamada public_html. Fue un error y costó caro: en cuanto por
          # cualquier motivo apareció un public_html dentro de public_html, la
          # prueba pasó a dar "sí" y los despliegues empezaron a dejar el sitio
          # en public_html/public_html — una carpeta que el servidor no publica.
          # Desde fuera el despliegue salía en verde y el sitio se quedaba
          # congelado en la versión anterior, que es el peor fallo posible:
          # silencioso. Una detección que puede acertar o fallar según lo que
          # haya en el disco es peor que un valor fijo y explícito.
          DESTINO="${FTP_DIR:-.}"

          echo "Subiendo a: $DESTINO"

          # Una conexión, y nada que no sea subir archivos.
          #
          # Este paso ha tenido dos versiones peores, las dos por querer dejar
          # constancia de en qué carpeta aterrizaba:
          #
          #   · Tres invocaciones de lftp aparte para listar. Cuatro conexiones
          #     seguidas donde antes había una, y este hosting compartido no
          #     rechaza el exceso: lo deja colgado. Seis minutos hasta agotar
          #     el tiempo límite.
          #   · Un 'cls' dentro de la misma sesión. Parecía gratis y no lo era:
          #     en FTP un listado abre un canal de datos propio, y con la
          #     cuenta limitada ese canal extra se queda sin reintentos y
          #     tumba la sesión entera antes de subir un solo archivo.
          #
          # La carpeta de destino ya no hace falta comprobarla aquí: el paso
          # siguiente le pide la página al dominio de verdad, que es la única
          # prueba que de verdad importa. Un diagnóstico que rompe el proceso
          # que vigila es peor que no tener diagnóstico.
          # Tres intentos, no uno.
          #
          # lftp ya reintenta por dentro cada conexión (net:max-retries), pero
          # eso no cubre el caso que de verdad ocurre en un hosting compartido:
          # que la sesión entera se quede colgada y muera por tiempo. Cuando
          # eso pasa, el trabajo se pierde entero aunque el servidor esté
          # perfectamente bien treinta segundos después.
          #
          # Cada intento tiene su propio límite de tiempo, para que uno colgado
          # no se coma el presupuesto de los siguientes; entre uno y otro se
          # espera cada vez más, que es lo que hace falta cuando el servidor
          # está estrangulando conexiones por exceso.
          subir() {
            timeout 300 lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate $VERIFICAR;
            set net:timeout 20;

            # Margen para el estrangulamiento del hosting compartido: cuando
            # rechaza una conexión por exceso, suele aceptarla unos segundos
            # después. Con 3 reintentos inmediatos el despliegue se rendía.
            set net:max-retries 6;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-multiplier 1.5;

            # Sin esto, lftp pide al servidor el listado normal, que NO incluye
            # los archivos que empiezan por punto. Y lo que no ve, no lo borra:
            # --delete dejaba huérfanos los .htaccess de versiones anteriores
            # creyendo que la carpeta ya estaba limpia.
            set ftp:list-options -a;

            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';

            # Un despliegue anterior dejó un .htaccess dentro de assets/ para
            # cachear un año. El servidor empezó a responder 403 a TODA la
            # carpeta: el sitio servía su HTML y no su código, o sea, en blanco.
            # Quitarlo del repositorio no bastaba, porque el archivo ya vivía en
            # el servidor y el espejo no lo veía. Esto lo borra explícitamente;
            # -f para que no proteste cuando ya no exista, que es lo que pasará
            # de ahora en adelante.
            rm -f $DESTINO/assets/.htaccess;

            # Las cabeceras por ruta de las industrias con su nombre viejo.
            #
            # El espejo de abajo va SIN --delete a propósito, así que un archivo
            # que deja de existir en el repositorio se queda en el servidor para
            # siempre. Con estos eso no es inocuo: la regla de _pages del
            # .htaccess encuentra el archivo, lo sirve, y la dirección vieja
            # responde 200 con la página nueva dentro en vez de redirigir. Para
            # un buscador son dos direcciones con el mismo contenido, que es
            # justo lo que la mudanza venía a evitar — y es por lo que Google
            # todavía tiene indexadas tres de las viejas.
            #
            # -f para que no proteste cuando ya no existan, que es lo que
            # pasará a partir del segundo despliegue.
            rm -f $DESTINO/_pages/es/industrias/servicios-financieros.html;
            rm -f $DESTINO/_pages/es/industrias/retail-consumo.html;
            rm -f $DESTINO/_pages/es/industrias/travel-hospitality.html;
            rm -f $DESTINO/_pages/es/industrias/real-estate-construction.html;
            rm -f $DESTINO/_pages/es/industrias/healthcare-life-sciences.html;
            rm -f $DESTINO/_pages/en/industries/financial-services.html;
            rm -f $DESTINO/_pages/en/industries/retail-consumer.html;
            rm -f $DESTINO/_pages/en/industries/healthcare-life-sciences.html;

            # Y los permisos de la carpeta. Un directorio que el servidor web
            # no puede leer devuelve 403 en todo lo que hay dentro, que es
            # exactamente el síntoma, y no se arregla borrando archivos. Si ya
            # estaban bien, esto no cambia nada; si no, el sitio vuelve.
            chmod -R 755 $DESTINO/assets;

            # 1. El bundle con hash va con --delete: esa carpeta es solo nuestra,
            #    y sin borrar acumularía todos los bundles de todos los despliegues
            #    para siempre.
            mirror --reverse --delete --parallel=2 --verbose dist/assets/ $DESTINO/assets/;

            # 2. El resto va SIN --delete, a propósito. Si hubiera algo más en
            #    public_html —un archivo de verificación de dominio, un correo,
            #    cualquier cosa puesta a mano— borrarlo desde aquí sería
            #    destruir trabajo que este repositorio no conoce.
            mirror --reverse --parallel=2 --verbose --exclude-glob assets/* dist/ $DESTINO/;
          "
          }

          for intento in 1 2 3; do
            if subir; then
              echo "Subida completada en el intento $intento."
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              ESPERA=$((intento * 45))
              echo "::warning::La subida falló en el intento $intento. Reintentando en ${ESPERA}s."
              sleep "$ESPERA"
            fi
          done

          echo "::error::La subida al hosting falló en los tres intentos. El sitio sigue publicando la versión anterior; lo que se acaba de compilar NO está en la web. Vuelve a lanzar este despliegue desde la pestaña Actions cuando el FTP de Hostinger responda."
          exit 1

      - name: Comprobar que lo subido es lo que se publica
        # Un despliegue que sube los archivos a una carpeta que el servidor no
        # publica termina en verde igual que uno correcto, y el sitio se queda
        # congelado en la versión anterior sin que nada lo avise. Pasó, y costó
        # varias horas encontrarlo. La única comprobación que lo detecta es
        # pedirle la página al dominio de verdad, por HTTP, y ver si responde
        # con lo que se acaba de subir.
        run: |
          set -uo pipefail

          # El nombre del bundle lleva un hash del contenido: si el sitio
          # publicado apunta a otro archivo, está sirviendo otra versión.
          #
          # 'sed -n 1p' y no 'head -1': head cierra la tubería en cuanto tiene
          # su línea, grep muere con SIGPIPE y con pipefail activo eso cuenta
          # como fallo del paso entero aunque la búsqueda haya ido bien. Pasó
          # en el primer intento de esta comprobación: abortaba antes de
          # imprimir nada. sed lee hasta el final, así que no hay tubería rota.
          LOCAL=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | sed -n 1p || true)
          if [ -z "$LOCAL" ]; then
            echo "::warning::No se pudo leer el nombre del bundle en dist/index.html; se omite la comprobación."
            exit 0
          fi

          # -L es obligatorio: la raíz responde 301 hacia /es, y sin seguir la
          # redirección curl devuelve un cuerpo vacío y la comprobación se
          # queda sin nada que mirar. La cadena del final evita que conteste
          # una copia guardada del CDN.
          REMOTO_HTML=$(curl -fsSL --max-time 30 \
            -A 'despliegue-become/1.0' \
            "https://meetbecome.com/?nocache=${GITHUB_SHA}" || true)
          REMOTO=$(printf '%s' "$REMOTO_HTML" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | sed -n 1p || true)

          echo "Bundle recién compilado : $LOCAL"
          echo "Bundle que sirve el sitio: ${REMOTO:-(no se pudo leer)}"

          if [ -z "$REMOTO" ]; then
            echo "::warning::No se pudo leer https://meetbecome.com para comprobarlo. Revisa el sitio a mano."
            exit 0
          fi
          if [ "$LOCAL" != "$REMOTO" ]; then
            echo "::error::El sitio publicado NO es el que se acaba de subir. Los archivos han ido a parar a una carpeta que el servidor no publica. Revisa arriba, en '── Dónde estamos en el FTP ──', cuál es la carpeta real, y ponla en la variable FTP_DIR del repositorio (Settings → Secrets and variables → Actions → pestaña Variables)."
            exit 1
          fi
          echo "El sitio publicado es esta versión."

          # ── Lo que el servidor hace con las cabeceras ──
          #
          # El bundle lleva hash en el nombre, así que comprobar que cambió
          # solo prueba que el HTML es nuevo. Lo que NO se veía es qué hace el
          # servidor con lo demás: durante días sirvió el logotipo viejo y unas
          # caducidades de caché que ya no estaban en el .htaccess, porque las
          # respuestas venían de una caché intermedia. Desde fuera el
          # despliegue estaba en verde y la auditoría seguía quejándose de algo
          # ya arreglado.
          #
          # Estas dos comprobaciones no detienen el despliegue —no todo depende
          # de nosotros— pero dejan el dato escrito en el registro en vez de
          # obligar a deducirlo.
          # Se mide el peso REAL que viaja por el cable, no la cabecera que lo
          # anuncia. La primera versión de esto usaba `curl -I`, que no manda
          # Accept-Encoding: el servidor respondía sin comprimir —con toda la
          # razón, nadie se lo había pedido— y la comprobación denunciaba un
          # problema que no existía. Comparar bytes bajados contra bytes en
          # disco no admite esa confusión.
          #
          # Sin --compressed a propósito: así curl NO descomprime, y
          # size_download es lo que de verdad cruzó la red.
          BYTES_LOCAL=$(stat -c%s "dist/${LOCAL}")
          # Se piden también estado y tipo. Sin ellos, «pesa menos de lo
          # esperado» es ambiguo: puede ser compresión o puede ser que el
          # servidor esté contestando otra cosa —una página de error, el
          # index.html de la SPA— con un peso que parece una compresión
          # buenísima. Pasó: 2.482 bytes donde debía haber 106.000.
          # El mismo User-Agent de navegador en las dos peticiones, y no es
          # cosmético: la del HTML lo llevaba y respondía 200; estas dos no, y
          # respondían 403 con una página de bloqueo de 2.482 bytes. El
          # cortafuegos del hosting rechaza a curl cuando pide archivos
          # estáticos. Se dio por caído un sitio que estaba sirviendo
          # perfectamente a sus visitantes, y se persiguieron durante una hora
          # dos causas inventadas —un .htaccess y unos permisos— que no lo eran.
          #
          # Una comprobación tiene que pedir las cosas como las pide un
          # visitante. Si no, mide su propio reflejo.
          # Tres cosas que una petición de verdad lleva y `curl` a secas no:
          # el User-Agent de un navegador, un Referer del propio dominio y un
          # Accept. Sin el Referer, la protección anti-enlazado de Hostinger
          # responde 403 a los archivos estáticos —es su función: impedir que
          # otro sitio cuelgue de los tuyos— y la comprobación leía ese bloqueo
          # como si la web estuviera caída.
          #
          # Costó una hora y dos arreglos a ciegas descubrirlo: se borró un
          # .htaccess y se corrigieron unos permisos que no tenían nada que ver,
          # mientras el sitio servía con total normalidad a sus visitantes. La
          # pista estaba a la vista desde el principio: el 403 seguía igual
          # después de cada arreglo, y eso solo puede significar que el problema
          # está en quien pregunta.
          NAVEGADOR='Mozilla/5.0 (Linux; Android 11; moto g power) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Mobile Safari/537.36'
          COMO_UN_VISITANTE=(-A "$NAVEGADOR" -e 'https://meetbecome.com/es' -H 'Accept: */*')

          LEIDO=$(curl -sS --max-time 20 -o /dev/null \
            "${COMO_UN_VISITANTE[@]}" \
            -H 'Accept-Encoding: gzip, br' \
            -w '%{http_code} %{content_type} %{size_download}' \
            "https://meetbecome.com/${LOCAL}" || echo "000 - 0")
          ESTADO=$(printf '%s' "$LEIDO" | cut -d' ' -f1)
          TIPO=$(printf '%s' "$LEIDO" | cut -d' ' -f2)
          BYTES_RED=$(printf '%s' "$LEIDO" | cut -d' ' -f3)
          CACHE=$(curl -sSI --max-time 20 "${COMO_UN_VISITANTE[@]}" "https://meetbecome.com/${LOCAL}" \
            | grep -i '^cache-control:' | tr -d '\r' || true)

          echo "Bundle en disco  : ${BYTES_LOCAL} B"
          echo "Bundle por la red: ${BYTES_RED} B  ·  estado ${ESTADO}  ·  tipo ${TIPO}"
          echo "${CACHE:-cache-control: (ninguna)}"

          if [ "$ESTADO" = "403" ]; then
            # Sigue sin poder afirmarse nada del sitio: 403 aquí es el
            # cortafuegos del hosting, no la web. Se dice y se sigue.
            echo "::warning::403 al pedir el bundle, incluso pidiéndolo como lo pide un navegador. Es el cortafuegos del hosting bloqueando peticiones desde fuera de un navegador real; NO significa que la web esté mal. Compruébala abriéndola. Lo que sí queda sin medir es si el JavaScript viaja comprimido."
          elif [ "$ESTADO" != "200" ]; then
            echo "::error::El bundle no se sirve: el servidor responde ${ESTADO} en /${LOCAL}. El sitio está cargando el HTML pero no su código."
            exit 1
          else
            case "$TIPO" in
              *javascript*|*ecmascript*) : ;;
              *) echo "::error::El servidor devuelve '${TIPO}' donde debería haber JavaScript en /${LOCAL}. Alguna regla del .htaccess está desviando las peticiones a assets/." ; exit 1 ;;
            esac

            # Un bundle de JavaScript comprime a menos de la mitad. Si lo que
            # viaja pesa casi lo mismo que el archivo, no se está comprimiendo.
            if [ "${BYTES_RED:-0}" -eq 0 ]; then
              echo "::warning::No se pudo medir el peso transferido. Compruébalo a mano."
            elif [ "$BYTES_RED" -gt $((BYTES_LOCAL * 70 / 100)) ]; then
              echo "::warning::El JavaScript viaja SIN COMPRIMIR: ${BYTES_RED} B de ${BYTES_LOCAL} B. En móvil eso es más de un segundo perdido. Revisa que el bloque mod_deflate del .htaccess incluya text/javascript."
            else
              echo "Comprimido al $((BYTES_RED * 100 / BYTES_LOCAL)) % de su tamaño."
            fi
          fi

      - name: Las direcciones viejas de industrias siguen redirigiendo
        # Que el 301 esté escrito en el .htaccess no prueba que actúe: puede
        # que el módulo no esté activo, que el archivo no subiera, o que la
        # reescritura de la SPA se adelante y la dirección vieja acabe
        # respondiendo 200 con la página nueva dentro. Eso último es el caso
        # peor: para un buscador no es una mudanza, son dos direcciones con el
        # mismo contenido, que es justo lo que la mudanza venía a evitar.
        #
        # Se comprueba DESPUÉS de subir, contra el dominio real, porque antes
        # de subir no hay nada que preguntar.
        continue-on-error: true
        id: redirects
        run: node scripts/verificar-redirects.mjs

      - name: Y si alguna dejó de redirigir, el despliegue lo dice
        if: steps.redirects.outcome == 'failure'
        run: |
          echo "::error::Alguna dirección vieja de industrias dejó de responder 301. El paso anterior dice cuál."
          exit 1

      # Después de comprobar que el sitio sirve lo nuevo, y no antes: el aviso
      # incluye la dirección del archivo de clave, y si el buscador va a
      # buscarlo y todavía no está subido, rechaza el aviso entero.
      #
      # Nunca hace fallar el despliegue: avisar a un buscador es una cortesía,
      # no una condición para publicar.
      - name: Avisar a IndexNow de lo que cambió
        continue-on-error: true
        run: node scripts/indexnow.mjs

      - name: Comprobar que el correo del formulario funciona
        # Conecta y se autentica contra el servidor de correo, sin enviar
        # ningún mensaje. Es lo único que distingue "el formulario está
        # publicado" de "el formulario sirve para algo": un buzón con la
        # contraseña caducada deja el sitio impecable por fuera mientras cada
        # mensaje que alguien escribe se pierde sin que nadie se entere.
        run: |
          set -uo pipefail
          RES=$(curl -sS --max-time 40 -X POST \
                  -H 'Content-Type: application/json' \
                  -d "{\"ping\":\"${MAIL_PING_TOKEN}\"}" \
                  "https://meetbecome.com/api/contacto.php" || true)
          echo "Respuesta: ${RES:-(sin respuesta)}"

          case "$RES" in
            *'"ok":true'*)
              echo "El formulario puede enviar correo." ;;
            '')
              echo "::warning::No hubo respuesta de la comprobación. Revisa el formulario a mano." ;;
            *)
              ETAPA=$(printf '%s' "$RES" | sed -n 's/.*"stage":"\([^"]*\)".*/\1/p')
              echo "::error::El formulario NO puede enviar correo. Falló en la etapa: ${ETAPA:-desconocida}. 'auth-clave' = la contraseña de MAIL_PASSWORD no es la del buzón; 'auth-usuario' = la dirección de MAIL_USER no existe; 'conexion' = el servidor no alcanza a MAIL_HOST; 'config' = el despliegue no dejó bien las credenciales. El motivo completo está en public_html/api/errores.log."
              exit 1 ;;
          esac

      - name: Avisar por correo de los artículos nuevos
        # ---- Por qué este paso se reescribió ----
        #
        # Decía «ningún artículo nuevo en este despliegue» tanto cuando no
        # había ninguno como cuando NO PODÍA SABERLO, y las dos cosas se leen
        # igual en el log: verde. El 23 de agosto se publicó «Qué puede hacer
        # un agente sin supervisión», el despliegue terminó en verde y ningún
        # suscriptor recibió nada.
        #
        # La causa era el clon superficial —arreglado arriba con fetch-depth—
        # pero el fallo de verdad es de este paso: un guardián que no distingue
        # «no hay nada que hacer» de «no he podido mirar» es peor que no
        # tenerlo, porque informa de éxito cuando ha fallado.
        env:
          DIFUSION_TOKEN: ${{ secrets.DIFUSION_TOKEN }}
          ANTES: ${{ github.event.before }}
          A_MANO: ${{ github.event.inputs.difundir }}
        run: |
          set -uo pipefail
          if [ -z "${DIFUSION_TOKEN:-}" ]; then
            echo "Sin DIFUSION_TOKEN no se avisa a nadie. Es opcional."
            exit 0
          fi

          # Reenvío a mano desde la pestaña Actions. Es la salida para un
          # artículo que se quedó sin aviso.
          if [ -n "${A_MANO:-}" ]; then
            NUEVOS="src/content/insights/${A_MANO}"
            if [ ! -f "$NUEVOS" ]; then
              echo "::error::No existe $NUEVOS. Usa el nombre del archivo tal como está en src/content/insights/."
              exit 1
            fi
            echo "Reenvío pedido a mano: $NUEVOS"
          else
            # ¿Se puede comparar siquiera? Un commit que no está en la copia
            # local hace fallar el diff, y sin esta comprobación ese fallo se
            # confunde con «no hay artículos nuevos».
            if [ -z "${ANTES:-}" ] || [ "$ANTES" = "0000000000000000000000000000000000000000" ]; then
              echo "Primer push a esta rama: no hay commit anterior con el que comparar."
              exit 0
            fi
            if ! git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
              echo "::error::El commit anterior ${ANTES} no está en la copia del repositorio, así que no se puede saber qué artículo es nuevo. El checkout tiene que usar fetch-depth: 0."
              exit 1
            fi
            NUEVOS=$(git diff --name-only --diff-filter=A "$ANTES" "${GITHUB_SHA}" -- src/content/insights/ | grep '\.json$' || true)
            if [ -z "$NUEVOS" ]; then
              echo "Comparado ${ANTES:0:7}..${GITHUB_SHA:0:7}: ningún artículo nuevo en este despliegue."
              exit 0
            fi
          fi

          FALLOS=0
          for f in $NUEVOS; do
            [ -f "$f" ] || continue
            if [ "$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('estado'))" "$f")" != "publicado" ]; then
              echo "$f es un borrador; no se avisa."
              continue
            fi
            for LANG in es en; do
              CARGA=$(DIFUSION_TOKEN="$DIFUSION_TOKEN" python3 - "$f" "$LANG" <<'PY'
          import json, os, sys
          a = json.load(open(sys.argv[1])); lang = sys.argv[2]; t = a.get(lang)
          if not t or not t.get('slug'):
              print(''); raise SystemExit
          print(json.dumps({
              'accion': 'difundir',
              'token': os.environ['DIFUSION_TOKEN'],
              'idioma': lang,
              'titulo': t['titulo'],
              'entradilla': t.get('entradilla') or t.get('descripcion') or '',
              'ruta': f"/{lang}/insights/{t['slug']}",
          }, ensure_ascii=False))
          PY
              )
              [ -n "$CARGA" ] || continue
              RES=$(curl -sS --max-time 180 -X POST -H 'Content-Type: application/json' \
                      -d "$CARGA" "https://meetbecome.com/api/suscripcion.php" || true)
              echo "$LANG → ${RES:-(sin respuesta)}"
              # Una respuesta que no confirma el envío es un fallo, no un aviso:
              # el propósito entero del paso es que el correo salga.
              case "$RES" in
                *'"ok":true'*) ;;
                *) echo "::error::La difusión en $LANG no salió: ${RES:-(sin respuesta del servidor)}"; FALLOS=$((FALLOS+1)) ;;
              esac
            done
          done
          [ "$FALLOS" -eq 0 ] || exit 1

      - name: Resumen
        # El resumen dice qué secretos están puestos y cuáles faltan. No sus
        # valores: solo si tienen contenido o no.
        #
        # Existe porque diagnosticar esto leyendo el registro es imposible en
        # la práctica: la subida de archivos escribe miles de líneas y entierra
        # los pasos de configuración. Un secreto que falta se veía igual que
        # uno que sobra, o sea, no se veía.
        if: always()
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          PANEL_TOKEN: ${{ secrets.PANEL_TOKEN }}
          PANEL_USUARIOS: ${{ secrets.PANEL_USUARIOS }}
          BD_BASE: ${{ secrets.BD_BASE }}
          BD_USUARIO: ${{ secrets.BD_USUARIO }}
          BD_CLAVE: ${{ secrets.BD_CLAVE }}
          BD_HOST: ${{ secrets.BD_HOST }}
          DIFUSION_TOKEN: ${{ secrets.DIFUSION_TOKEN }}
        run: |
          echo "### Desplegado a producción" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Sitio: https://meetbecome.com" >> $GITHUB_STEP_SUMMARY
          echo "- Páginas en el sitemap: $(grep -c '<loc>' dist/sitemap.xml)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Secretos" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Secreto | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for nombre in MAIL_USER PANEL_TOKEN PANEL_USUARIOS BD_HOST BD_BASE BD_USUARIO BD_CLAVE DIFUSION_TOKEN; do
            valor="${!nombre:-}"
            if [ -z "$valor" ]; then
              echo "| \`$nombre\` | **FALTA** |" >> $GITHUB_STEP_SUMMARY
            else
              # Un espacio al principio o al final es el error de copiar y pegar
              # más común, y el que más cuesta encontrar: el secreto existe, se
              # ve bien y no funciona.
              limpio="$(printf '%s' "$valor" | tr -d '[:space:]')"
              if [ ${#limpio} -ne ${#valor} ]; then
                echo "| \`$nombre\` | puesto, pero **lleva espacios sobrantes** |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| \`$nombre\` | puesto (${#valor} caracteres) |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
