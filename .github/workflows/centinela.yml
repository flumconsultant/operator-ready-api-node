# Comprueba a diario que la web sirve lo que el repositorio da por publicado.
#
# Las otras dos capas evitan que el despliegue falle. Esta comprueba el
# resultado, que no es lo mismo: un despliegue puede terminar en verde y dejar
# el sitio sin actualizar —ya pasó, subiendo los archivos a public_html/public_html—,
# y un despliegue que nunca llega a arrancar no falla, simplemente no ocurre.
#
# La pregunta que hace es la única que importa: ¿está en la web lo que el
# repositorio dice que está publicado? Si la respuesta es no, relanza el
# despliegue y vuelve a preguntar. Si sigue siendo no, falla en rojo, y GitHub
# manda el correo.
#
# No usa secretos ni credenciales: lee los artículos del repositorio y pide las
# páginas al dominio público.

name: Centinela de publicación

on:
  schedule:
    # 13:30 UTC — dos horas y media después de que la rutina escriba el artículo
    # del día (11:00 UTC) y con margen de sobra para que el despliegue termine y
    # para los dos reintentos automáticos. Antes de esa hora, un fallo aquí
    # sería solo impaciencia.
    - cron: '30 13 * * *'
    # Y otra vez a las 20:00 de Perú. La de la mañana cubre el artículo del día;
    # esta cubre lo que se publica por la tarde. La noche del 22 de agosto el
    # FTP del hosting se cayó a las seis de la tarde y, sin esta segunda pasada,
    # un sitio desactualizado a esa hora se habría quedado así hasta la mañana
    # siguiente sin que nadie lo supiera.
    - cron: '0 1 * * *'
  workflow_dispatch:
  # Y después de cada despliegue que termina bien.
  #
  # Antes era un `push`, y era una carrera: el push lanzaba el centinela y el
  # despliegue a la vez, así que el centinela pedía al sitio unas páginas que
  # todavía se estaban compilando. La primera vez que ocurrió se saldó con un
  # despliegue de rescate innecesario —el mecanismo se curó solo, pero por un
  # problema que no existía—. Esperar al despliegue quita la carrera y, de
  # paso, comprueba TODOS los despliegues en vez de solo los que tocan este
  # archivo.
  workflow_run:
    workflows: ['Desplegar a Hostinger']
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: centinela
  cancel-in-progress: false

jobs:
  vigilar:
    # Un despliegue que falló ya avisa por su cuenta; comprobar el sitio
    # después no añade información y sí ruido.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ¿Está publicado lo que dice el repositorio?
        id: primera
        continue-on-error: true
        run: node scripts/centinela.mjs

      # Solo si la primera respuesta fue que no.
      # Solo cuando la comprobación llega en frío: la diaria o una lanzada a
      # mano. Después de un despliegue no se relanza nada, y por dos motivos:
      # el despliegue acaba de correr, así que repetirlo tal cual repetiría el
      # resultado; y relanzarlo desde aquí crearía un bucle —despliegue,
      # centinela, despliegue— que solo pararía al agotar los minutos de la
      # cuenta. En ese caso el trabajo falla en rojo, que es lo correcto:
      # alguien tiene que mirarlo.
      - name: Relanzar el despliegue
        if: steps.primera.outcome == 'failure' && github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::warning::El sitio no está sirviendo todo lo publicado. Relanzando el despliegue."
          gh workflow run deploy.yml --ref main

      - name: Esperar a que termine
        if: steps.primera.outcome == 'failure' && github.event_name != 'workflow_run'
        run: |
          # Un despliegue completo tarda unos seis minutos entre compilar,
          # prerenderizar y subir. Diez da margen sin agotar el trabajo.
          sleep 600

      - name: Volver a comprobar
        if: steps.primera.outcome == 'failure' && github.event_name != 'workflow_run'
        run: |
          set -euo pipefail
          node scripts/centinela.mjs
          echo "El despliegue de rescate funcionó: el sitio ya sirve todo lo publicado."

      # Tras un despliegue no hay rescate, así que el fallo de la comprobación
      # tiene que llegar hasta el resultado del trabajo: `continue-on-error` lo
      # había dejado pasar.
      - name: Fallar si el sitio no sirve lo publicado
        if: steps.primera.outcome == 'failure' && github.event_name == 'workflow_run'
        run: |
          echo "::error::El despliegue terminó bien pero el sitio no sirve todo lo publicado. Revisa el paso «¿Está publicado lo que dice el repositorio?»."
          exit 1

      - name: Resumen
        if: always()
        run: |
          if [ "${{ steps.primera.outcome }}" = "success" ]; then
            echo "### Centinela: todo publicado" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "La web sirve todos los artículos que el repositorio da por publicados." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Centinela: hubo que relanzar el despliegue" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "El sitio no estaba sirviendo todo lo publicado. Se lanzó un despliegue de rescate;" >> "$GITHUB_STEP_SUMMARY"
            echo "el resultado está en el paso «Volver a comprobar»." >> "$GITHUB_STEP_SUMMARY"
          fi
